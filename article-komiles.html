<script>

function md(s){let o='',ul=false;for(const r of s.replace(/\\r/g,'').split('\\n')){let x=r.trim();if(!x){if(ul){o+='</ul>';ul=false}continue}if(x.startsWith('### ')){o+='<h3>'+esc(x.slice(4))+'</h3>';continue}if(x.startsWith('## ')){o+='<h2>'+esc(x.slice(3))+'</h2>';continue}if(x.startsWith('# ')){o+='<h2>'+esc(x.slice(2))+'</h2>';continue}if(x.startsWith('- ')||x.startsWith('* ')){if(!ul){o+='<ul>';ul=true}o+='<li>'+esc(x.slice(2))+'</li>';continue}if(ul){o+='</ul>';ul=false}o+='<p>'+esc(x)+'</p>'}if(ul)o+='</ul>';return o}
