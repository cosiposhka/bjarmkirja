<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bjarmkirja — Финно-угорская библиотека</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="#/" class="logo-group">
        <!-- Восьмиконечная финно-угорская звезда (этнический символ) -->
        <svg class="logo-star" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <g fill="#D52B1E" stroke="#000000" stroke-width="1.5" stroke-linejoin="round">
            <!-- 8 лучей звезды -->
            <polygon points="50,2 56,38 92,20 62,44 98,50 62,56 92,80 56,62 50,98 44,62 8,80 38,56 2,50 38,44 8,20 44,38" />
          </g>
          <!-- Центр -->
          <circle cx="50" cy="50" r="10" fill="#000000" />
        </svg>
        <div class="logo-text">
          <span class="logo-name">Bjarmkirja</span>
          <span class="logo-tagline">Финно-угорская библиотека</span>
        </div>
      </a>

      <div class="header-right">
        <button class="theme-toggle" onclick="toggleTheme()" title="Тёмная/светлая тема">
          <span class="theme-icon">🌓</span>
        </button>

        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="ru" onclick="setLang('ru')">RU</button>
          <button class="lang-btn" data-lang="fi" onclick="setLang('fi')">FI</button>
          <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
          <button class="lang-btn" data-lang="et" onclick="setLang('et')">ET</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Search bar вынесен отдельно, чтобы не терял фокус -->
  <div id="search-bar"></div>

  <div id="app"></div>

  <footer class="footer">
    <div class="footer-inner">
      <p>© 2026 Bjarmkirja</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
