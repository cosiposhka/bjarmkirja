<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bjarmkirja — Финно-угорская библиотека</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="#/" class="logo-group">
        <!-- Солярный знак Удмуртии (белый) -->
        <svg class="logo-star" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Белый крестострел: вертикальная + горизонтальная полосы шириной 100 (1/3) -->
  <!-- Зубцы: внутренние стороны 90°, вершина углублена на 50 (1/2 ширины полосы) -->
  <path fill="#ffffff" d="
    M 100,0
    L 150,50
    L 200,0
    L 200,100
    L 300,100
    L 250,150
    L 300,200
    L 200,200
    L 200,300
    L 150,250
    L 100,300
    L 100,200
    L 0,200
    L 50,150
    L 0,100
    L 100,100
    Z
  "/>
</svg>
        <div class="logo-text">
          <span class="logo-name">Bjarmkirja</span>
          <span class="logo-tagline">Финно-угорская библиотека</span>
        </div>
      </a>

      <nav class="header-nav" id="header-nav">
        <a href="#/" class="nav-btn active" data-i18n="home">Главная</a>
        <a href="#/catalog/books" class="nav-btn" data-i18n="catalogBooks">Каталог книг</a>
        <a href="#/catalog/articles" class="nav-btn" data-i18n="catalogArticles">Каталог статей</a>
      </nav>

      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="ru" onclick="setLang('ru')">RU</button>
        <button class="lang-btn" data-lang="fi" onclick="setLang('fi')">FI</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" data-lang="et" onclick="setLang('et')">ET</button>
      </div>
    </div>
  </header>

  <div id="search-bar"></div>

  <div id="app"></div>

  <footer class="footer">
    <div class="footer-inner">
      <p>© 2026 Bjarmkirja</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
